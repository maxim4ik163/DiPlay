      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Project CI checks (AGENTS.md)
        run: |
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
            :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
            :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Push the branch
        run: |
          git push --force origin "HEAD:refs/heads/$BRANCH"
          {
            echo "### Branch \`$BRANCH\` is ready (based on upstream $BASE_SHA)"
            echo
            echo "Open the pull request: $UPSTREAM/compare/main...${{ github.repository_owner }}:${{ github.event.repository.name }}:$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: |
            shared/build/reports/
            common/build/reports/
            mobile/build/reports/
            samples/home/build/reports/
            samples/maphost/build/reports/
          if-no-files-found: ignore
