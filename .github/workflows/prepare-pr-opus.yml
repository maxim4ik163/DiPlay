name: Prepare PR branch (software Opus microphone)

# Creates the branch opus-software-encoder in this fork, based on the current upstream main:
#   1. "Vendor Concentus, a pure-Java Opus encoder" (lostromb/concentus at CONCENTUS_COMMIT)
#   2. "Encode the microphone in software Opus when MediaCodec has no Opus encoder"
# Both commits are authored by the account that runs this workflow. The project's full CI
# command from AGENTS.md runs before the push. Open the pull request from the link in the summary.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-pr-opus.yml

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/shihabal3amri/DiPlay
  BRANCH: opus-software-encoder
  CONCENTUS_COMMIT: 3885c4e46513ef0fc81fca100189e54f1714c6ca

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start from upstream main
        run: |
          git fetch -q "$UPSTREAM" main
          git checkout -q -B "$BRANCH" FETCH_HEAD
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          echo "BASE_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git log --oneline -1
      - name: Commit 1 - vendor Concentus
        run: |
          mkdir "$RUNNER_TEMP/concentus"
          git -C "$RUNNER_TEMP/concentus" init -q
          git -C "$RUNNER_TEMP/concentus" fetch -q --depth 1 https://github.com/lostromb/concentus "$CONCENTUS_COMMIT"
          git -C "$RUNNER_TEMP/concentus" checkout -q FETCH_HEAD
          mkdir -p shared/src/main/java/org
          cp -r "$RUNNER_TEMP/concentus/Java/Concentus/src/main/java/org/concentus" shared/src/main/java/org/
          cp "$RUNNER_TEMP/concentus/LICENSE" shared/src/main/java/org/concentus/LICENSE
          base64 -d > "$RUNNER_TEMP/notes.patch" <<'PATCH'
