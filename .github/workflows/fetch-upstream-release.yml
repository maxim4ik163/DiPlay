name: Fetch upstream release APK

# Test build only: copies the official DiPlay release APK into a draft release of this fork,
# so its accessory identity files can be added to test builds.

on:
  push:
    branches:
      - test/fetch-release

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the latest upstream release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          tag=v0.2.19
          gh release view "$tag" -R shihabal3amri/DiPlay --json assets -q '.assets[].name' 2>&1 | while read -r l; do echo "::warning::asset $l"; done
          mkdir out
          gh release download "$tag" -R shihabal3amri/DiPlay -p '*.apk' -D out 2>&1 | while read -r l; do echo "::warning::$l"; done
          ls out | while read -r l; do echo "::warning::downloaded $l"; done
          gh release create "upstream-$tag" out/*.apk -R "$GITHUB_REPOSITORY" --draft \
            --title "Upstream release APK $tag (for identity files)" --notes "Copy of the official $tag APK." 2>&1 | while read -r l; do echo "::warning::$l"; done
