      - name: Add Concentus (pure-Java Opus, BSD-3-Clause)
        run: |
          mkdir "$RUNNER_TEMP/concentus"
          cd "$RUNNER_TEMP/concentus"
          git init -q
          git fetch -q --depth 1 https://github.com/lostromb/concentus "$CONCENTUS_COMMIT"
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          cp -r "$RUNNER_TEMP/concentus/Java/Concentus/src/main/java/org" shared/src/main/java/
          cp "$RUNNER_TEMP/concentus/LICENSE" docs/licenses/Concentus-LICENSE.txt
          git status --short
      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest --stacktrace
      - name: Build release APK
        run: |
          ./gradlew :mobile:assembleRelease --stacktrace
          mkdir -p out
          cp mobile/build/outputs/apk/release/mobile-release.apk "out/DiPlay-${SRC_SHA}-opus-hotspot.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-test-apk-no-identity
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
          if-no-files-found: ignore
