name: Build test APKs (software Opus microphone)

# Builds two release APKs from this repository's current source:
#   upstream - the source as it is
#   opus-sw  - the same source with the embedded software-Opus microphone patch and Concentus
# Neither APK contains the accessory identity; both are signed with a throwaway key generated
# in the runner. Add the runtime identity and re-sign them before installing.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-test-apks.yml

permissions:
  contents: read

env:
  CONCENTUS_COMMIT: 3885c4e46513ef0fc81fca100189e54f1714c6ca

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-pass -keypass ci-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=DiPlay CI throwaway"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-pass"
            echo "ANDROID_KEY_ALIAS=ci"
            echo "ANDROID_KEY_PASSWORD=ci-pass"
          } >> "$GITHUB_ENV"
          echo "SRC_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build upstream release APK (without the fix)
        run: |
          ./gradlew :mobile:assembleRelease --stacktrace
          mkdir -p out
          cp mobile/build/outputs/apk/release/mobile-release.apk "out/DiPlay-${SRC_SHA}-upstream.apk"
      - name: Apply software-Opus microphone patch
        run: |
          base64 -d > "$RUNNER_TEMP/opus-sw.patch" <<'PATCH'
