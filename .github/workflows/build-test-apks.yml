name: Build test APK (Opus microphone + car hotspot patches)

# Builds one release APK from this repository's current source with three embedded patches:
#   1. software Opus microphone encoder (Concentus) when MediaCodec has no Opus encoder
#   2. automatic car hotspot startup on non-BYD head units through "Modify system settings" access
#   3. open the car hotspot settings when wireless startup finds the hotspot off
# The APK contains no accessory identity and is signed with a throwaway key generated in the
# runner. Add the runtime identity and re-sign it before installing.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-test-apks.yml

permissions:
  contents: read

env:
  CONCENTUS_COMMIT: 3885c4e46513ef0fc81fca100189e54f1714c6ca

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-pass -keypass ci-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=DiPlay CI throwaway"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-pass"
            echo "ANDROID_KEY_ALIAS=ci"
            echo "ANDROID_KEY_PASSWORD=ci-pass"
          } >> "$GITHUB_ENV"
          echo "SRC_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Apply patch 1 (software Opus microphone)
